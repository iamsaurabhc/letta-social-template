[build]
  base = "/"
  package = "apps/client"
  command = """
    # Install global dependencies
    npm i -g pnpm@8.15.4 --force && \
    # Install root dependencies
    pnpm install --no-frozen-lockfile && \
    # Build common package
    cd packages/common && \
    pnpm install --no-frozen-lockfile && \
    npm install typescript@5.3.3 --save-dev && \
    ./node_modules/.bin/tsc && \
    cd ../.. && \
    # Build client
    cd apps/client && \
    rm -rf node_modules && \
    npm install next && \
    pnpm install --no-frozen-lockfile && \
    NODE_ENV=production NEXT_TELEMETRY_DISABLED=1 npx --no-install next build
  """
  publish = "apps/client/.next"

[build.environment]
  NODE_VERSION = "18.17.0"
  NPM_FLAGS = "--version"
  NEXT_TELEMETRY_DISABLED = "1"
  PNPM_VERSION = "8.15.4"
  USE_PNPM = "true"
  CI = "true"
  NODE_OPTIONS = "--max_old_space_size=4096"

# Ensure clean environment
[build.lifecycle]
  onPreBuild = """
    rm -rf node_modules
    rm -rf packages/common/node_modules
    rm -rf apps/client/node_modules
    rm -f /opt/buildhome/.nvm/versions/node/v18.17.0/bin/pnpx
    rm -f /opt/buildhome/.nvm/versions/node/v18.17.0/bin/pnpm
    npm cache clean --force
  """

# Handle Next.js routing
[[redirects]]
  from = "/_next/*"
  to = "/_next/:splat"
  status = 200

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "https://api.socialspi.com/:splat"
  status = 200
  force = true
  headers = {Access-Control-Allow-Origin = "*"}

# Handle client-side routing for Next.js app
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true

[functions]
  # Increase the build timeout
  node_bundler = "esbuild"
  included_files = ["apps/client/.next/static/**"]

[dev]
  framework = "next"
  targetPort = 3000

[build.processing]
  skip_processing = false 