[build]
  base = "/"
  package = "apps/client"
  command = """
    # Install global dependencies
    npm i -g pnpm@8.15.4 --force && \
    # Install root dependencies
    pnpm install --no-frozen-lockfile && \
    # Build common package
    cd packages/common && \
    pnpm install --no-frozen-lockfile && \
    npx tsc && \
    cd ../.. && \
    # Build client
    cd apps/client && \
    pnpm install --no-frozen-lockfile && \
    NODE_ENV=production NEXT_TELEMETRY_DISABLED=1 pnpm build
  """
  publish = "apps/client/.next"

[build.environment]
  NODE_VERSION = "18.17.0"
  NPM_FLAGS = "--version"
  NEXT_TELEMETRY_DISABLED = "1"
  PNPM_VERSION = "8.15.4"
  USE_PNPM = "true"
  CI = "true"
  NODE_OPTIONS = "--max_old_space_size=4096"

# Ensure clean environment
[build.lifecycle]
  onPreBuild = """
    rm -rf node_modules
    rm -rf packages/common/node_modules
    rm -rf apps/client/node_modules
    rm -f /opt/buildhome/.nvm/versions/node/v18.17.0/bin/pnpx
    rm -f /opt/buildhome/.nvm/versions/node/v18.17.0/bin/pnpm
    npm cache clean --force
  """

# Handle Next.js routing
[[redirects]]
  from = "/*"
  to = "/_next/static/:splat"
  status = 200
  force = true
  conditions = {Path = "/_next/static/*"}

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Handle API routes by redirecting to external API
[[redirects]]
  from = "/*"
  to = "https://api.socialspi.com/:splat"
  status = 200
  force = true
  headers = {Access-Control-Allow-Origin = "*"} 