[build]
  base = "/"
  command = "pnpm install && pnpm build:common && cd apps/client && pnpm build"
  publish = "apps/client/.next"
  node_version = "18.17.0"

[build.environment]
  NODE_VERSION = "18.17.0"
  NPM_FLAGS = "--version"
  NEXT_TELEMETRY_DISABLED = "1"
  PNPM_VERSION = "8.15.4"
  USE_PNPM = "true"

# Install pnpm before build
[build.lifecycle]
  onPreBuild = "npm i -g pnpm@8.15.4"

# Handle Next.js routing
[[redirects]]
  from = "/*"
  to = "/_next/static/:splat"
  status = 200
  force = true
  conditions = {Path = "/_next/static/*"}

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Handle API routes by redirecting to external API
[[redirects]]
  from = "/*"
  to = "https://api.socialspi.com/:splat"
  status = 200
  force = true
  headers = {Access-Control-Allow-Origin = "*"} 